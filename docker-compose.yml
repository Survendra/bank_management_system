services:
  api:
    build:
      context: .
      dockerfile: deploy/aws/Dockerfile.backend
    command:
      - gunicorn
      - --bind
      - 0.0.0.0:5000
      - --workers
      - "2"
      - --threads
      - "2"
      - app:app
    env_file:
      - .env
    environment:
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:?Set FRONTEND_ORIGINS in .env}
      PORT: "5000"
      FLASK_DEBUG: "false"
      SESSION_COOKIE_SECURE: "true"
      SESSION_COOKIE_SAMESITE: Lax
    expose:
      - "5000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: deploy/aws/Dockerfile.backend
    command:
      - python
      - scheduled_transfer_worker.py
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: deploy/aws/Dockerfile.frontend
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/aws/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      - frontend

volumes:
  caddy_data:
  caddy_config:
