server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api {
        proxy_pass http://api:5000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /api/ {
        proxy_pass http://api:5000;
        include /etc/nginx/proxy_params;
    }

    location = /docs {
        proxy_pass http://api:5000;
        include /etc/nginx/proxy_params;
    }

    location ^~ /docs/ {
        proxy_pass http://api:5000;
        include /etc/nginx/proxy_params;
    }

    location = /openapi.json {
        proxy_pass http://api:5000;
        include /etc/nginx/proxy_params;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
